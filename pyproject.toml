[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aws-lambda-slo-optimizer"
version = "0.1.0"
description = "SLO-aware AWS Lambda deployment optimizer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "LambdaOpt Contributors" }
]
keywords = ["aws", "lambda", "slo", "optimization", "cloudwatch", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "boto3>=1.34,<2",
  "botocore>=1.34,<2",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/Mike-Animal-Counseling/aws-lambda-slo-optimizer"
Documentation = "https://github.com/Mike-Animal-Counseling/aws-lambda-slo-optimizer/tree/main/docs"
Repository = "https://github.com/Mike-Animal-Counseling/aws-lambda-slo-optimizer"
Issues = "https://github.com/Mike-Animal-Counseling/aws-lambda-slo-optimizer/issues"

[project.optional-dependencies]
aws = [
  "boto3>=1.34,<2",
  "botocore>=1.34,<2",
]
charts = [
  "matplotlib>=3.8",
]
dashboard = [
  "streamlit>=1.36",
]
dev = [
  "build>=1.2",
  "hatchling>=1.25",
  "matplotlib>=3.8",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[project.scripts]
lambdaopt = "lambdaopt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["lambdaopt"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/docs",
  "/examples",
  "/lambdaopt",
  "/pyproject.toml",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["lambdaopt", "tests"]

[[tool.mypy.overrides]]
module = ["typer.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["streamlit.*"]
ignore_missing_imports = true
