name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,aws,charts]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

      - name: Security regression tests
        run: |
          python -m pytest tests/test_security_redaction.py tests/test_no_credentials_in_reports.py tests/test_doctor.py tests/test_iam_generate.py
          python -c "from pathlib import Path; forbidden=['AWS_'+'ACCESS_KEY_ID','AWS_'+'SECRET_ACCESS_KEY','AWS_'+'SESSION_TOKEN']; text='\n'.join(p.read_text(encoding='utf-8') for p in Path('.github/workflows').glob('*.yml')); found=[item for item in forbidden if item in text]; raise SystemExit('Forbidden AWS secret references in workflows: '+', '.join(found) if found else 0)"

      - name: Build package
        run: python -m build
